<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SNOR App Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button onclick="connectDevice()">CONNECT</button>
  <button onclick="saveToDevice()">SAVE</button>

  <div class="apps">
    <div draggable="true" ondragstart="drag(event)" data-name="EDGE">EDGE</div>
    <div draggable="true" ondragstart="drag(event)" data-name="DISCORD">DISCORD</div>
    <div draggable="true" ondragstart="drag(event)" data-name="YOUTUBE">YOUTUBE</div>
    <div draggable="true" ondragstart="drag(event)" data-name="FILES">FILES</div>
    <div draggable="true" ondragstart="drag(event)" data-name="TASK">TASK</div>
    <div draggable="true" ondragstart="drag(event)" data-name="ARDUINO">ARDUINO</div>
    <div draggable="true" ondragstart="drag(event)" data-name="VS">VS</div>
    <div draggable="true" ondragstart="drag(event)" data-name="SETTINGS">SETTINGS</div>
  </div>

  <div class="grid">

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

    <div class="slot"
      ondrop="drop(event)"
      ondragover="allowDrop(event)">
      <img>
      <span></span>
    </div>

  </div>

  <input type="file" id="imagePicker" accept="image/*" hidden>

  <p id="status">NOT CONNECTED</p>

  <script src="app.js"></script>

</body>
</html>
